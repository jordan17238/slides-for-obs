# Builds the macOS installer (SlidesForOBS.pkg) from the plugin that the main
# build workflow (push.yaml) produces.
#
# Mirrors installer.yaml (the Windows one): it runs after "Push" completes,
# downloads that run's macOS artifact, and packages it. Kept as a SEPARATE
# workflow so a packaging failure can never affect the plugin build itself.
#
# pkgbuild/productbuild are Apple tools, so this must run on a macOS runner.

name: Build Installer (macOS)

on:
  workflow_run:
    workflows: ["Push"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  installer:
    # Run whenever the plugin build completes on a push. We deliberately do NOT
    # require conclusion == 'success': the template's clang-format / gersemi
    # style checks can mark the whole run "failure" even when the macOS plugin
    # built fine. If there is genuinely no macOS artifact, the download step
    # below fails cleanly.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'push'
    runs-on: macos-latest
    steps:
      - name: Check out repository (for the installer resources)
        uses: actions/checkout@v4

      - name: Download the macOS plugin artifact
        uses: actions/download-artifact@v4
        with:
          pattern: "*macos*"
          path: artifact-download
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Unpack and locate the plugin bundle
        id: unpack
        run: |
          set -euo pipefail

          echo "=== what came down ==="
          find artifact-download -maxdepth 3 -print

          # GitHub wraps artifacts in a zip; the template's macOS artifact may
          # itself contain a zip or a tarball. Expand whatever we find.
          mkdir -p dist
          while IFS= read -r archive; do
            echo "expanding: $archive"
            case "$archive" in
              *.zip) unzip -q -o "$archive" -d dist ;;
              *.tar.gz|*.tgz) tar -xzf "$archive" -C dist ;;
            esac
          done < <(find artifact-download -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.tgz' \))

          # If nothing was archived, the bundle may already be sitting there.
          if [ ! -d dist ] || [ -z "$(ls -A dist 2>/dev/null)" ]; then
            cp -R artifact-download/* dist/ 2>/dev/null || true
          fi

          echo "=== dist tree ==="
          find dist -maxdepth 4 -print

          # A .plugin is a bundle (a directory). Find it wherever it landed.
          PLUGIN="$(find dist artifact-download -maxdepth 5 -type d -name '*.plugin' | head -1)"
          if [ -z "$PLUGIN" ]; then
            echo "error: no .plugin bundle found — see the tree above" >&2
            exit 1
          fi
          echo "found plugin bundle: $PLUGIN"
          echo "plugin=$PLUGIN" >> "$GITHUB_OUTPUT"

      - name: Derive version string
        id: ver
        run: |
          set -euo pipefail
          NAME="$(find artifact-download -maxdepth 2 | head -20 | tr '\n' ' ')"
          VER="0.1.0"
          if [[ "$NAME" =~ ([0-9]+\.[0-9]+\.[0-9]+) ]]; then
            VER="${BASH_REMATCH[1]}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "version = $VER"

      - name: Build the installer package
        run: |
          chmod +x installer/macos/build-pkg.sh
          installer/macos/build-pkg.sh \
            "${{ steps.unpack.outputs.plugin }}" \
            "${{ steps.ver.outputs.version }}" \
            "$GITHUB_WORKSPACE/installer/macos/Output"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: SlidesForOBS-macOS-${{ steps.ver.outputs.version }}
          path: installer/macos/Output/SlidesForOBS.pkg
          if-no-files-found: error
