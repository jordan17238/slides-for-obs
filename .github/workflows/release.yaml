name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wait for this commit's build runs to finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1800 ))
          while :; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
                     --jq '[.workflow_runs[] | select(.name != "Release") | {name, status, conclusion}]')
            total=$(jq 'length' <<<"$runs")
            pending=$(jq '[.[] | select(.status != "completed")] | length' <<<"$runs")
            win=$(jq '[.[] | select(.name == "Build Installer" and .status == "completed")] | length' <<<"$runs")
            echo "runs=$total pending=$pending win_installer=$win"
            jq -r '.[] | "  \(.name): \(.status)/\(.conclusion // "-")"' <<<"$runs"
            if [ "$total" -gt 0 ] && [ "$pending" -eq 0 ] && [ "$win" -gt 0 ]; then
              echo "All runs for this commit are finished."
              break
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::warning::Timed out waiting; continuing with whatever exists."
              break
            fi
            sleep 20
          done

      - name: Gather artifacts from this commit's runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p release-files
          ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100" \
                  --jq '.workflow_runs[] | select(.name != "Release") | .id')
          echo "Runs to pull from: $ids"
          for id in $ids; do
            echo "--- run $id"
            gh run download "$id" --repo "$GITHUB_REPOSITORY" --dir "release-files/$id" \
              || echo "    (no artifacts in this run)"
          done
          echo "Everything gathered:"
          find release-files -type f | sort

      - name: Stage installers
        run: |
          set -euo pipefail
          mkdir -p dist
          find release-files -type f \( -name '*.exe' -o -name '*.pkg' -o -name '*.zip' \) \
            -exec cp -v {} dist/ \;
          echo "Staged for release:"
          ls -l dist
          if [ ! -f dist/SlidesForOBS-Setup.exe ]; then
            echo "::error::Windows installer missing."
            exit 1
          fi
          if ! ls dist/*.pkg >/dev/null 2>&1; then
            echo "::error::macOS .pkg missing from the Push run artifact."
            exit 1
          fi

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
